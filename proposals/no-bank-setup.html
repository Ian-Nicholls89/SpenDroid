:root{--acc:#43b05c;--bg:#18191d;--card:#23252b;--chip:#2a2c33;--line:#33363e;--mute:#8d929c;--red:#e5534b;--amber:#f5a623}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0e0f12;font-family:Lato,sans-serif;color:#fff;min-height:100vh}
.wrap{display:flex;gap:40px;justify-content:center;align-items:flex-start;padding:30px 20px}
.side{width:400px;padding-top:6px}
.side h1{font-weight:900;font-size:26px}
.side .lead{color:#9aa0aa;font-size:14px;line-height:1.5;margin:8px 0 18px}
.notes{background:#17181c;border:1px solid #2a2b30;border-radius:14px;padding:16px 18px;font-size:14px;line-height:1.5;color:#c9ccd3}
.notes h2{font-size:17px;color:#fff;margin-bottom:6px}
.notes p{margin-bottom:10px}
.notes .tag{display:inline-block;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:900;letter-spacing:.5px;margin:0 6px 6px 0}
.t-new{background:#1d3550;color:#7cc4ff}.t-have{background:#1f3a2a;color:#5fd38a}.t-play{background:#3a2f18;color:var(--amber)}
.side .tools{display:flex;gap:10px;margin-top:14px}
.side button{font:inherit;font-weight:700;font-size:13px;background:#23252b;color:#fff;border:1px solid #33363e;border-radius:10px;padding:8px 14px;cursor:pointer}
.map{margin-top:16px;font-size:12px;color:var(--mute);line-height:1.8}
.map span{cursor:pointer;color:#aab;text-decoration:underline dotted}
.map span.on{color:var(--acc);font-weight:900;text-decoration:none}

.phone{width:390px;height:820px;flex:none;border-radius:38px;background:var(--bg);border:8px solid #2a2b30;position:relative;overflow:hidden}
.status{height:30px;display:flex;justify-content:space-between;padding:8px 22px 0;font-size:12px;color:#ddd;font-weight:700;position:relative;z-index:3}
.glow{position:absolute;left:0;right:0;top:0;height:220px;background:linear-gradient(180deg,rgba(67,176,92,.33),rgba(24,25,29,0));pointer-events:none}
#screen{position:absolute;inset:30px 0 0 0;overflow-y:auto;scrollbar-width:none;padding-bottom:24px}
#screen::-webkit-scrollbar{display:none}
.top{display:flex;align-items:center;gap:14px;padding:10px 18px 0;position:relative;z-index:2}
.back{font-size:22px;cursor:pointer;color:#cfd2d8;width:24px}
.word{font-weight:900;letter-spacing:4px;font-size:20px;color:var(--acc)}
.steps{display:flex;gap:6px;margin:14px 18px 6px;position:relative;z-index:2}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line);display:block}.steps i.on{background:var(--acc)}
.steplab{font-size:11px;color:var(--mute);margin:0 18px 12px;letter-spacing:.5px;position:relative;z-index:2}
h2.t{font-weight:900;font-size:24px;line-height:1.2;margin:8px 18px 6px;position:relative;z-index:2}
.p{color:#b8bcc5;font-size:14px;line-height:1.5;margin:0 18px 14px;position:relative;z-index:2}
.sec{font-size:12px;font-weight:900;letter-spacing:1.6px;text-transform:uppercase;color:#e8e9ec}
.sub{font-size:12px;color:var(--mute)}
.card{background:var(--card);border-radius:14px;margin:0 14px 12px;padding:14px 16px;position:relative;z-index:2}
.big{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--acc);color:#111;border-radius:14px;padding:15px 0;font-weight:900;font-size:15px;margin:0 14px 10px;cursor:pointer;user-select:none;position:relative;z-index:2}
.big:active{filter:brightness(.9)}
.ghost{background:var(--chip);color:#fff}
.link{color:var(--acc);font-weight:700;font-size:13px;cursor:pointer}
.choice{display:flex;gap:14px;align-items:flex-start;background:var(--card);border-radius:14px;margin:0 14px 10px;padding:16px;cursor:pointer;border:2px solid transparent;position:relative;z-index:2}
.choice:hover{border-color:#3a3d45}
.choice .ic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;flex:none}
.choice b{font-size:16px;display:block;margin-bottom:3px}
.choice .d{font-size:13px;color:#aab;line-height:1.45}
.rec{display:inline-block;background:#1f3a2a;color:#5fd38a;border-radius:6px;font-size:10px;font-weight:900;padding:2px 6px;margin-left:6px;vertical-align:2px;letter-spacing:.5px}

 .wrap{flex-direction:column;align-items:center;padding:0;gap:16px}

 .side{width:100%;max-width:430px;padding:0 16px 30px}

</style></head><body>
<div class="wrap">
 <div class="phone"><div class="glow"></div>
  <div class="status"><span>9:41</span><span>Sat 17 Oct · 5G ▮▮▮</span></div>
  <div id="screen"></div>
 </div>
 <div class="side">
  <h1>No bank link · setup mock-up</h1>
  <div class="lead">Click through it the way a new user would, on a fresh phone. It's only a web page: it doesn't touch your app or your data. Banks, payees and figures are made up.</div>
  <div class="notes" id="notes"></div>
  <div class="tools"><button onclick="restart()">↺ Start again</button><button onclick="back()">← Back</button></div>
  <div class="map" id="map"></div>
 </div>
</div>
<script>
const S = {accounts: [], picking: null, imported: {}, apps: {wallet: true, bank: true, card: true}, statementEvery: 'Week', balanceEvery: 'Sunday', checked: false, path: 'import', shared: {}, spends: null, always: {}};
let stack = [];
const $ = s => document.querySelector(s);
const STEPS = ['Accounts', 'History', 'Check', 'Keep it current', 'Done'];
const steps = n => `<div class="steps">${STEPS.map((_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('')}</div><div class="steplab">STEP ${n} OF 5 · ${STEPS[n - 1].toUpperCase()}</div>`;
const bar = (back = true) => `<div class="top">${back ? '<span class="back" onclick="back()">←</span>' : ''}<span class="word">SPENDROID</span></div>`;
const tag = (k, t) => `<span class="tag t-${k}">${t}</span>`;
const COLOURS = ['#5c6bc0', '#2bb5a0', '#e5487a', '#f5a623'];

const SCREENS = {
 welcome: {
  label: 'Welcome',
  notes: `<h2>1 · Welcome</h2>
   <p>This is the first screen after installing. Today it asks straight away for GoCardless keys, which new users can't get. Here, <b>no bank link</b> is the main way in.</p>
   <p>GoCardless stays as an option further down, for anyone who already has keys, like you. Choosing it opens today's screen.</p>
   ${tag('new', 'NEW')} the choice itself. Everything behind "Link a bank" is unchanged.`,
  html: () => `${bar(false)}
   <h2 class="t" style="margin-top:40px">Know what you can spend, every day</h2>
   <div class="p">SpenDroid works out what's left until payday, after your bills and card statements. Everything stays on this phone: no account, no server.</div>
   <div style="height:10px"></div>
   <div class="choice" onclick="go('accounts')"><div class="ic" style="background:#1f3a2a;color:#5fd38a">⇪</div><div><b>Use your bank's statements<span class="rec">RECOMMENDED</span></b><div class="d">Download a statement from your bank's app or website. SpenDroid reads it, then stays up to date from your banking notifications.</div></div></div>
   <div class="choice" onclick="go('fresh')"><div class="ic" style="background:#2a2c33;color:#cfd2d8">✎</div><div><b>Start from today</b><div class="d">No statement to hand? Tell SpenDroid your balance and payday, and it learns your bills as they come.</div></div></div>
   <div style="text-align:center;margin-top:26px"><span class="link" style="color:#8d929c" onclick="go('advanced')">I have GoCardless keys · link a bank</span></div>`
 },
 advanced: {
  label: 'GoCardless (advanced)',
  notes: `<h2>GoCardless, for people who already have keys</h2><p>This is today's onboarding screen, unchanged and moved behind the link. It's how your own copy keeps syncing.</p><p>Someone who links a bank later can still have imported accounts: the two sit side by side, and a linked account's history can be topped up with an import, as it can now.</p>${tag('have', 'BUILT')}`,
  html: () => `${bar()}<h2 class="t" style="margin-top:16px">Link a bank with GoCardless</h2>
   <div class="p">This opens today's setup screen (secret_id, secret_key, then choosing your bank).</div>
   <div class="card"><div class="sub">GoCardless is closed to new sign-ups, so this only helps if you already have keys.</div></div>
   <div class="big ghost" onclick="back()">Go back</div>`
 },
 accounts: {
  label: 'Add accounts',
  notes: `<h2>2 · Your accounts</h2><p>Accounts are added by hand: a name, a type and the bank's name. The type matters most: credit cards are counted through their bill, the way your budget works now.</p>
   <p>Pick a suggestion to fill the form in a click. Add a current account and a credit card to see both kinds through the rest of the setup.</p>${tag('new', 'NEW')} adding an account without a bank link.`,
  html: () => `${bar()}${steps(1)}
   <h2 class="t">Which accounts do you use?</h2>
   <div class="p">Add the account you're paid into first, then any credit cards. You can add more later.</div>
   <div class="card">${S.accounts.length ? S.accounts.map((a, i) => `<div class="acct"><span class="sq" style="background:${a.colour}"></span><div><div class="n">${a.name}</div><div class="sub">${a.bank} · ${a.type}</div></div><div class="r sub">${i === 0 && a.type !== 'Credit card' ? 'Paid in here' : ''}</div></div>`).join('') : '<div class="sub" style="padding:6px 0">No accounts yet</div>'}</div>
   <div class="big ghost" onclick="sheet('addAccount')">＋ Add an account</div>
   ${S.accounts.length ? `<div class="big" onclick="go('history')">Next</div>` : ''}`
 },
 history: {
  label: 'Import history',
  notes: `<h2>3 · Bring in your history</h2><p>One statement file per account: as many months as the bank allows (6 to 12 is best). SpenDroid uses it to find your pay, your bills and your card's statement dates. That's why there's so little to type.</p>
   <p>"How do I get one?" opens short steps for the bank the user named, e.g. "Barclays app → Statements → Export → CSV".</p>
   <p>Any account can be skipped and filled in by hand.</p>${tag('have', 'BUILT')} reading CSV, OFX and QIF, and the duplicate check. ${tag('new', 'NEW')} the per-bank instructions.`,
  html: () => `${bar()}${steps(2)}
   <h2 class="t">Bring in your history</h2>
   <div class="p">Download a statement from each bank's app or website, as a <b>CSV, OFX or QIF</b> file. The more months, the better SpenDroid knows your bills.</div>
   ${S.accounts.map((a, i) => `<div class="card"><div style="display:flex;align-items:center;gap:10px"><span class="sq" style="background:${a.colour}"></span><b style="font-size:15px">${a.name}</b>
     ${S.imported[i] ? `<span class="ok" style="margin-left:auto;font-size:13px">✓ ${S.imported[i].rows} transactions</span>` : ''}</div>
     ${S.imported[i] ? `<div class="sub" style="margin-top:6px">${S.imported[i].file} · ${S.imported[i].span}</div>` :
     `<div style="display:flex;gap:16px;margin-top:12px;align-items:center"><span class="c on" onclick="S.picking=${i};sheet('files')">⇪ Choose file</span><span class="link" onclick="S.picking=${i};sheet('how')">How do I get one?</span><span class="link" style="margin-left:auto;color:#8d929c" onclick="S.imported[${i}]={rows:0,file:'Skipped',span:'add its balance in the next step'};render()">Skip</span></div>`}
   </div>`).join('')}
   ${S.accounts.every((_, i) => S.imported[i]) ? `<div class="big" onclick="go('reading')">Next</div>` : `<div class="p sub" style="text-align:center">Choose a file for each account, or skip it.</div>`}`
 },
 reading: {
  label: 'Reading',
  notes: `<h2>Reading the files</h2><p>This takes a second or two on the phone. It runs the same analysis your app already uses for regular payments and card statements.</p>${tag('have', 'BUILT')}`,
  html: () => `${bar(false)}${steps(3)}
   <div style="padding:120px 30px 0;text-align:center;position:relative;z-index:2"><div style="font-size:20px;font-weight:900">Reading your statements…</div>
   <div class="prog"><i id="pg"></i></div><div class="sub" id="pgt">Finding your pay</div></div>`,
  after: () => {
   setTimeout(() => $('#pg') && ($('#pg').style.width = '100%'), 50);
   setTimeout(() => $('#pgt') && ($('#pgt').textContent = 'Finding regular bills'), 600);
   setTimeout(() => $('#pgt') && ($('#pgt').textContent = 'Working out your card statement dates'), 1150);
   setTimeout(() => stack[stack.length - 1] === 'reading' && go('found', true), 1800);
  }
 },
 found: {
  label: "What it found",
  notes: `<h2>4 · Check what it found</h2><p>This is the one screen that asks for a look rather than typing. Everything is a guess from the files, and each line can be changed or switched off.</p>
   <p><b>Pay</b> sets your cycle. <b>Bills</b> become Regular. <b>Balance</b> comes from the file's last row; if the file has no balance column, it's asked for here.</p>
   ${tag('have', 'BUILT')} spotting pay and bills. ${tag('new', 'NEW')} this check screen, and a balance taken from the file.`,
  html: () => {
   const card = S.accounts.find(a => a.type === 'Credit card');
   return `${bar()}${steps(3)}
   <h2 class="t">Here's what we found</h2>
   <div class="p">Untick anything that's wrong. You can change it all later in Regular.</div>
   <div class="card"><div class="sec">Your pay</div>
    <div class="row" style="border:0"><div><b>ACME DESIGN LTD</b><div class="x">Last working day of the month · next Fri 30 Oct</div></div><span class="a" style="color:#5fd38a">+£2,340.00</span></div>
    <span class="link">Change</span></div>
   <div class="card"><div class="sec">Regular bills · ${card ? '£1,156.99 a month + the card bill' : '£1,294.98 a month'}</div>
    ${[['Rent', '1st', '£850.00'], ['Council tax', '1st', '£148.00'], ['Octopus Energy', '12th', '£92.00'], ['Vodafone', '18th', '£24.00'], ['PureGym', '22nd', '£32.00'], ['Netflix', '9th', '£10.99'], ...(card ? [['Card bill · ' + card.name, '28th', 'in full']] : [['Water', '20th', '£137.99']])].map(([n, d, a], i) => `<div class="row"><span class="tick on" onclick="this.classList.toggle('on');this.textContent=this.classList.contains('on')?'✓':''">✓</span><div>${n}<div class="x">Monthly · ${d}</div></div><span class="a">${a}</span></div>`).join('')}
   </div>
   <div class="card"><div class="sec">Balances</div>
    ${S.accounts.map((a, i) => `<div class="row"><span class="sq" style="background:${a.colour}"></span><div>${a.name}<div class="x">${S.imported[i] && S.imported[i].rows ? 'From the statement · 15 Oct' : 'Not in a file · type it in'}</div></div>
     ${S.imported[i] && S.imported[i].rows ? `<span class="a">${a.type === 'Credit card' ? '−£418.62' : a.type === 'Joint' ? '£642.18' : '£1,206.40'}</span>` : `<input class="in" style="width:110px;margin-left:auto;padding:7px 9px;font-size:14px" placeholder="£0.00">`}</div>`).join('')}
   </div>
   ${card ? `<div class="card"><div class="sec">${card.name}</div><div class="row" style="border:0"><div>Statement on the <b>3rd</b>, paid on the <b>28th</b><div class="x">From the payments in the file</div></div><span class="link" style="margin-left:auto">Change</span></div></div>` : ''}
   <div class="big" onclick="go('notify')">Looks right</div>`;
  }
 },
 fresh: {
  label: 'Start from today',
  notes: `<h2>Start from today (no file)</h2><p>The fallback: four answers and you're in. Without history there are no bills yet, so the budget starts as "pay minus what's left to pay this month". The user can add bills by hand, and Regular learns the rest as they come in through notifications.</p>${tag('new', 'NEW')}`,
  html: () => `${bar()}${steps(1)}
   <h2 class="t">Start from today</h2><div class="p">Four quick answers. SpenDroid learns your bills as they come.</div>
   <div class="card"><label class="f" style="margin-top:0">Account name</label><input class="in" value="Everyday Account">
   <label class="f">Balance right now</label><input class="in" value="£1,206.40">
   <label class="f">When are you paid?</label><div class="chips" onclick="pick(event)"><span class="c on">Last working day</span><span class="c">A set date</span><span class="c">Every 4 weeks</span><span class="c">Weekly</span></div>
   <label class="f">Usual take-home pay</label><input class="in" value="£2,340.00"></div>
   <div class="big ghost" onclick="sheet('addBill')">＋ Add a bill (optional)</div>
   <div class="big" onclick="S.path='fresh';S.accounts=[{name:'Everyday Account',bank:'Your bank',type:'Current',colour:COLOURS[0]}];go('notify')">Next</div>`
 },
 notify: {
  label: 'Notifications',
  notes: `<h2>5 · Keep it up to date</h2><p>Between statements, your banking app's notifications ("You spent £4.20 at Pret") are what keeps the budget current. The app already does this (Card alerts).</p>
   <p>${tag('play', 'PLAY STORE')} Google requires a clear explanation of what will be read and why, shown <i>before</i> the permission. That's this screen. It must also be easy to say no: "Not now" carries on without it.</p>${tag('have', 'BUILT')} reading notifications. ${tag('new', 'NEW')} this explanation and the account matching below.`,
  html: () => `${bar()}${steps(4)}
   <h2 class="t">Stay up to date between statements</h2>
   <div class="p">When you pay, your banking app and Google Wallet show a notification. SpenDroid can read those to count spending the moment it happens.</div>
   <div class="card" style="font-size:14px;line-height:1.6">
    <div><b>✓ Reads</b> payment notifications from the apps you choose</div>
    <div><b>✓ Stays</b> on this phone: nothing is sent anywhere</div>
    <div><b>✕ Never reads</b> messages, emails or any other app</div></div>
   <div class="big" onclick="go('sysperm')">Allow notification access</div>
   <div class="big ghost" onclick="S.apps={};go('remind')">Not now</div>
   <div class="p sub" style="text-align:center">Without it, SpenDroid is up to date as of your last statement.</div>`
 },
 sysperm: {
  label: 'Android permission',
  system: true,
  notes: `<h2>Android's own screen</h2><p>Android, not SpenDroid, shows this, and it can't be skipped. Turn the switch on and confirm to carry on.</p><p>If the phone is a Xiaomi, Samsung and so on, the page looks a little different, but it's the same step.</p>`,
  html: () => `<div class="sys"><div class="hd"><span class="back" onclick="back()">←</span>Notification read, reply & control</div>
   <div style="padding:6px 18px;color:#aab;font-size:13px">Apps that can read notifications</div>
   ${[['Android Auto', false], ['SpenDroid', 'x'], ['Pixel Watch', true]].map(([n, v]) => `<div style="display:flex;align-items:center;padding:16px 18px;font-size:16px"><span style="width:36px;height:36px;border-radius:50%;background:${n === 'SpenDroid' ? '#43b05c' : '#3a3d45'};margin-right:16px"></span>${n}<span style="margin-left:auto" class="toggle ${v === true ? 'on' : ''}" ${v === 'x' ? 'onclick="$(\'#dlg\').style.display=\'block\'"' : ''}></span></div>`).join('')}
   <div class="dlg" id="dlg" style="display:none"><h4>Allow notification access for SpenDroid?</h4><p>SpenDroid will be able to read all notifications, including personal information such as contact names and the text of messages you receive.</p>
   <div class="btns"><span onclick="$('#dlg').style.display='none'">Don't allow</span><span onclick="go('apps', true)">Allow</span></div></div></div>`
 },
 apps: {
  label: 'Which apps',
  notes: `<h2>Which apps, for which account</h2><p>SpenDroid looks for banking apps and Google Wallet on the phone and ticks them. Each is matched to accounts by the bank's name.</p>
   <p><b>Two accounts at one bank</b> (add a Barclays joint account to see it): many banking apps don't say which account paid. Where the notification shows the card's last four digits, that settles it, and SpenDroid learns the digits the first time you answer. Where it doesn't, you choose what happens:</p>
   <p><b>Ask me</b>: SpenDroid posts its own notification with a button for each account. Until you answer it isn't counted anywhere, so it can't be wrong.<br><b>Guess</b>: it goes where that shop has usually been paid from, marked as a guess.<br><b>Always one account</b>: for someone who barely uses the other.</p>
   ${tag('have', 'BUILT')} digits, guessing from history, "which card?". ${tag('new', 'NEW')} this choice, and the buttons on the notification.`,
  html: () => {
   const banks = [...new Set(S.accounts.map(a => a.bank))];
   const BC = ['#00a4e0', '#2671b9', '#7b5cd6', '#d65c8a'];
   const list = [['wallet', 'Google Wallet', '#3a74e8', 'G', 'Cards in Wallet → their accounts', []]].concat(
     banks.map((b, i) => { const accts = S.accounts.filter(a => a.bank === b); return ['b' + i, b, BC[i % 4], b[0], '→ ' + accts.map(a => a.name).join(' and '), accts]; }));
   list.forEach(([k]) => { if (S.apps[k] === undefined) S.apps[k] = true; });
   return `${bar()}${steps(4)}<h2 class="t">Read payments from</h2><div class="p">Found on this phone. Untick any you don't want.</div>
   ${list.map(([k, n, c, l, m, accts]) => `<div class="card"><div class="row" style="border:0;padding:0"><span class="tick ${S.apps[k] ? 'on' : ''}" onclick="S.apps.${k}=!S.apps.${k};render()">${S.apps[k] ? '✓' : ''}</span><span style="width:30px;height:30px;border-radius:8px;background:${c};display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;flex:none">${l}</span><div>${n}<div class="x">${m}</div></div></div>
    ${accts.length > 1 && S.apps[k] ? `<div style="margin-top:12px;font-size:13px;color:#cfd2d8">${n}'s notifications don't always say which account. When they don't:</div>
     <div class="chips" style="margin-top:8px">${[['ask', 'Ask me'], ['guess', 'Guess from past payments'], ...accts.map((a, ai) => ['a' + ai, 'Always ' + a.name.replace(' Account', '')])].map(([v, t]) => `<span class="c ${(S.shared[n] || 'ask') === v ? 'on' : ''}" onclick="S.shared['${n}']='${v}';render()">${t}</span>`).join('')}</div>
     <div class="sub" style="margin-top:8px">${{ask: 'A tap on the notification puts it in the right account. Not counted until you answer.', guess: 'Put where that shop is usually paid from, marked as a guess you can change.'}[S.shared[n] || 'ask'] || 'You can still move any payment afterwards.'} Card digits, when shown, always win.</div>` : ''}</div>`).join('')}
   <div class="big" onclick="go('remind')">Next</div>`;
  }
 },
 remind: {
  label: 'Reminders',
  notes: `<h2>Two gentle reminders</h2><p>Notifications miss some things: direct debits, transfers and cash. So the app asks for two small habits, both optional:</p>
   <p><b>A new statement now and then</b> fills the gaps; duplicates are matched up automatically.<br><b>A balance check</b> means typing the number your banking app shows. Any difference is counted as spending, so the budget never drifts far.</p>${tag('new', 'NEW')} both reminders and the balance check.`,
  html: () => `${bar()}${steps(4)}<h2 class="t">Two small habits keep it right</h2>
   <div class="p">Notifications catch card spending. Direct debits and transfers turn up in your next statement.</div>
   <div class="card"><b>Remind me to import a statement</b><div class="sub" style="margin:4px 0 10px">Takes a minute, from the bank's app</div>
    <div class="chips" onclick="pick(event,'statementEvery')">${['Week', 'Fortnight', 'Month', 'Never'].map(x => `<span class="c ${S.statementEvery === x ? 'on' : ''}">${x === 'Never' ? 'Never' : 'Every ' + x.toLowerCase()}</span>`).join('')}</div></div>
   <div class="card"><b>Ask me to check my balance</b><div class="sub" style="margin:4px 0 10px">Type in what your banking app shows; any gap is counted</div>
    <div class="chips" onclick="pick(event,'balanceEvery')">${['Sunday', 'Payday', 'Never'].map(x => `<span class="c ${S.balanceEvery === x ? 'on' : ''}">${x === 'Never' ? 'Never' : x === 'Payday' ? 'On payday' : 'Every Sunday'}</span>`).join('')}</div></div>
   <div class="big" onclick="go('done')">Finish</div>`
 },
 done: {
  label: 'All set',
  notes: `<h2>6 · Done</h2><p>About a minute end to end, typing only account names (and nothing at all if the suggestions are right).</p><p>Next it offers the watch and widgets, as you know them.</p>`,
  html: () => `${bar(false)}${steps(5)}<div style="text-align:center;padding:70px 26px 0;position:relative;z-index:2">
   <div style="width:76px;height:76px;border-radius:50%;background:var(--acc);color:#111;font-size:40px;font-weight:900;display:flex;align-items:center;justify-content:center;margin:0 auto 22px">✓</div>
   <h2 style="font-size:24px;font-weight:900">You're set up</h2>
   <div class="p" style="margin:10px 0 26px">${S.path === 'fresh' ? 'Your budget starts today and gets sharper as SpenDroid sees your bills.' : `${S.accounts.length} account${S.accounts.length > 1 ? 's' : ''}, ${Object.values(S.imported).reduce((s, x) => s + x.rows, 0)} transactions, your pay and 7 bills.`}</div></div>
   <div class="card"><b>Add it to your watch face or home screen?</b><div class="sub" style="margin-top:4px">Left to spend at a glance. Set it up any time in Settings.</div></div>
   <div class="big" onclick="go('home')">See my budget</div>`
 },
 home: {
  label: 'Home',
  notes: `<h2>7 · Home, a few days later</h2><p>The same Home as now, with one addition: a line saying <b>how current</b> the figures are, as there's no live bank sync to rely on.</p>
   <p>When a balance check or statement is due, the line turns amber and offers it.</p>
   <p><b>Fixing an account:</b> tap any payment to move it, with "always put this shop here" so it isn't asked again. A guess is marked in amber. Tesco is one: guessed as Joint, really Everyday. Try <b>Check balance</b> before moving it: the check spots it.</p>
   <p>A later statement settles any guess too: the payment is matched to the statement's row, wherever the statement says it was.</p>
   <div style="margin:4px 0 10px"><button onclick="simulate()" style="font:inherit;font-weight:700;font-size:13px;background:#1d3550;color:#7cc4ff;border:0;border-radius:10px;padding:8px 12px;cursor:pointer">▶ Simulate a Barclays payment</button></div>
   ${tag('have', 'BUILT')} Home, matching to statements. ${tag('new', 'NEW')} the "how current" line, moving a payment, the balance check.`,
  html: () => {
   const left = (S.checked ? 486.22 - +(S.gap || 18.60) : 486.22) - spends().filter(x => x.extra && x.acct != null).reduce((t, x) => t + x.amt, 0);
   return `<div class="top"><div style="display:flex;flex-direction:column;gap:4px;width:20px">${'<i style="height:2px;background:#cfd2d8;display:block;border-radius:2px"></i>'.repeat(3)}</div><span class="word">OVERVIEW</span></div>
   <div style="height:14px"></div>
   ${S.checked ? `<div class="banner"><span style="color:#5fd38a;font-weight:900">✓</span><div>Balance checked today · £${S.gap || '18.60'} counted as spending</div></div>`
    : `<div class="banner amber"><span style="color:var(--amber);font-weight:900">!</span><div>Up to date from your statement (15 Oct) and <b>4</b> payments seen since</div><span class="link" style="margin-left:auto;white-space:nowrap" onclick="sheet('balance')">Check balance</span></div>`}
   <div class="card"><div class="sec">Left to spend</div>
    <div style="font-size:44px;font-weight:900;margin-top:4px">£${left.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',')}</div>
    <div class="sub">13 days to payday · about <b style="color:#fff">£${(left / 13).toFixed(0)}</b> a day</div>
    <div class="bar"><div class="f" style="width:${S.checked ? 41 : 43}%"></div><div class="pt" style="left:43%"></div></div></div>
   <div class="card"><div class="sec">Seen since your statement</div>
    ${spends().map((x, i) => `<div class="row" style="cursor:pointer" onclick="sheet('move',${i})"><div>${x.n}<div class="x">${x.src} · ${x.when}${x.acct != null ? ` · <span class="sq" style="display:inline-block;width:9px;height:9px;vertical-align:0;background:${S.accounts[x.acct].colour}"></span> ${S.accounts[x.acct].name.replace(' Account', '')}` : ''}${x.guessed ? ' <span style="color:var(--amber);font-weight:900">· guess</span>' : ''}</div></div>${x.acct == null ? '<span class="c" style="margin-left:auto;padding:5px 10px;font-size:12px;background:#3a2f18;color:var(--amber)">Which account?</span>' : `<span class="a">−£${x.amt.toFixed(2)}</span>`}</div>`).join('')}
    ${S.checked ? `<div class="row"><div>Not seen<div class="x">Balance check · today</div></div><span class="a">−£${S.gap || '18.60'}</span></div>` : ''}</div>
   <div class="card"><div class="sec">Coming up</div>
    <div class="row"><div>Vodafone<div class="x">Sun 18 Oct</div></div><span class="a">£24.00</span></div>
    <div class="row"><div>PureGym<div class="x">Thu 22 Oct</div></div><span class="a">£32.00</span></div></div>
   <div class="navb"><div><span class="pill">⌂</span>Home</div><div><span class="ico"></span>Spending</div><div onclick="sheet('files',1)" style="cursor:pointer"><span class="ico"></span>Import</div><div><span class="ico"></span>Regular</div></div>`;
  }
 },
};

const SHEETS = {
 addAccount: () => `<h3>Add an account</h3><div class="sub">Suggestions fill it in for you</div>
  <div class="chips" style="margin-top:12px">${S.accounts.some(a => a.type === 'Current') ? '' : `<span class="c" onclick="fillAcc('Everyday Account','Barclays','Current')">Barclays current</span>`}${S.accounts.some(a => a.type === 'Credit card') ? '' : `<span class="c" onclick="fillAcc('Rewards Card','Amex','Credit card')">Amex credit card</span>`}${S.accounts.some(a => a.type === 'Joint') ? '' : `<span class="c" onclick="fillAcc('Joint Account','Barclays','Joint')">Barclays joint</span>`}<span class="c" onclick="fillAcc('Rainy Day','Barclays','Savings')">Savings</span></div>
  <label class="f">Name</label><input class="in" id="an" placeholder="e.g. Current account">
  <label class="f">Bank</label><input class="in" id="ab" placeholder="e.g. Barclays">
  <label class="f">Type</label><div class="chips" id="at" onclick="pick(event)"><span class="c on">Current</span><span class="c">Credit card</span><span class="c">Savings</span><span class="c">Joint</span></div>
  <div class="big" onclick="addAcc()">Add</div>`,
 files: (fromHome) => `<h3>Choose a statement</h3><div class="sub">Downloads · the files a new user would see in Android's file picker</div>
  ${[['CSV', 'barclays-statement-oct26.csv', 'Today · 64 KB', 412, '18 Apr to 15 Oct'], ['CSV', 'barclays-joint-oct26.csv', 'Today · 31 KB', 203, '18 Apr to 15 Oct'], ['CSV', 'amex-activity.csv', 'Today · 22 KB', 156, '1 Apr to 14 Oct'], ['OFX', 'statement.ofx', '3 Oct · 48 KB', 290, '2 Apr to 2 Oct']].map(([k, f, d, r, sp]) => `<div class="file" onclick="${fromHome ? `closeSheet();toast('${r} transactions read · 286 already here, 126 new')` : `importFile('${f}',${r},'${sp}')`}"><span class="fi">${k}</span><div><div style="font-weight:700;font-size:14px">${f}</div><div class="sub">${d}</div></div></div>`).join('')}`,
 how: () => {
  const a = S.accounts[S.picking];
  return `<h3>Getting a statement from ${a.bank}</h3><div class="sub">Short steps for each big UK bank, kept in the app</div>
  <div class="card" style="margin:14px 0 0;background:#2a2c33;font-size:14px;line-height:1.9">1. Open the <b>${a.bank}</b> app<br>2. Tap the account, then <b>Statements</b><br>3. Choose <b>Export</b> or <b>Download</b>, pick <b>CSV</b><br>4. Choose as many months as it allows<br>5. Come back here and tap <b>Choose file</b></div>
  <div class="sub" style="margin-top:10px">No export in the app? Most banks offer it on their website.</div>
  <div class="big" onclick="closeSheet()">Got it</div>`;
 },
 addBill: () => `<h3>Add a bill</h3><label class="f">Who to</label><input class="in" value="Rent"><label class="f">Amount</label><input class="in" value="£850.00"><label class="f">Day of the month</label><input class="in" value="1"><div class="big" onclick="closeSheet()">Add</div>`,
 move: (i) => { const x = spends()[i]; return `<h3>${x.n} · £${x.amt.toFixed(2)}</h3><div class="sub">${x.src} · ${x.when}${x.guessed ? ' · put here as a guess' : ''}</div>
  <label class="f">Paid from</label>
  ${S.accounts.map((a, ai) => `<div class="row" style="cursor:pointer" onclick="moveTo(${i},${ai})"><span style="width:20px;height:20px;border-radius:50%;border:2px solid ${x.acct === ai ? 'var(--acc)' : '#5a5e68'};display:flex;align-items:center;justify-content:center;flex:none">${x.acct === ai ? '<i style="width:10px;height:10px;border-radius:50%;background:var(--acc);display:block"></i>' : ''}</span><span class="sq" style="background:${a.colour}"></span>${a.name}<span class="x" style="margin-left:auto">${a.bank}</span></div>`).join('')}
  <div class="row" style="border:0;margin-top:6px;cursor:pointer" onclick="S.always['${x.n}']=!S.always['${x.n}'];sheet('move',${i})"><span class="tick ${S.always[x.n] ? 'on' : ''}">${S.always[x.n] ? '✓' : ''}</span><div>Always put ${x.n} here<div class="x">Next time it won't ask or guess</div></div></div>
  <div class="big" onclick="closeSheet()">Done</div>`; },
 balance: () => `<h3>Check your balance</h3><div class="sub">Open your banking app and type what it shows for <b>${(S.accounts.find(a => a.type !== 'Credit card') || S.accounts[0]).name}</b></div>
  <div style="display:flex;justify-content:space-between;margin-top:14px;font-size:14px"><span class="sub">SpenDroid expects</span><b>£${money(expected())}</b></div>
  <label class="f">Your bank says</label><input class="in" id="bal" value="£${money(bankSays())}">
  <div class="sub" style="margin-top:10px">If they differ, the gap is something SpenDroid hasn't seen yet, like a direct debit or cash. It's counted as spending until a statement shows what it was.</div>
  <div class="big" onclick="checkBal()">Update</div>`,
 balanceResult: () => { const g = misplaced(); return `<h3>£${money(expected() - bankSays())} less than expected</h3>
  <div class="card" style="margin:14px 0 0;background:#2a2c33;font-size:14px;line-height:1.5"><b>£${g.amt.toFixed(2)} of it matches ${g.n}</b> (${g.when}), which was guessed to be ${S.accounts[g.acct].name}. Was it paid from ${S.accounts[0].name}?</div>
  <div class="big" onclick="moveTo(spends().indexOf(misplaced()),0);S.checked=true;closeSheet();render()">Yes, move it</div>
  <div class="big ghost" style="margin-top:10px" onclick="S.checked=true;S.gap=money(expected() - bankSays());closeSheet();render()">No, count the whole gap as spending</div>
  <div class="sub" style="margin-top:10px">The other £18.60 is counted as spending until a statement shows what it was.</div>`; },
};

function render() {
 const name = stack[stack.length - 1], sc = SCREENS[name];
 $('#screen').innerHTML = sc.html();
 $('#screen').scrollTop = 0;
 $('.glow').style.display = sc.system ? 'none' : 'block';
 $('#notes').innerHTML = sc.notes;
 $('#map').innerHTML = 'Jump to: ' + Object.keys(SCREENS).filter(k => k !== 'reading').map(k => `<span class="${k === name ? 'on' : ''}" onclick="jump('${k}')">${SCREENS[k].label}</span>`).join(' · ');
 sc.after && sc.after();
}
function go(name, replace) { if (replace) stack.pop(); stack.push(name); render(); }
function back() { closeSheet(); if (stack.length > 1) { stack.pop(); if (stack[stack.length - 1] === 'reading') stack.pop(); render(); } }
function restart() { location.reload(); }
function jump(k) {
 if (!S.accounts.length) { S.accounts = [{name: 'Everyday Account', bank: 'Barclays', type: 'Current', colour: COLOURS[0]}, {name: 'Joint Account', bank: 'Barclays', type: 'Joint', colour: COLOURS[2]}, {name: 'Rewards Card', bank: 'Amex', type: 'Credit card', colour: COLOURS[1]}]; }
 if (['found', 'home', 'done'].includes(k) && !Object.keys(S.imported).length) S.imported = {0: {rows: 412, file: 'barclays-statement-oct26.csv', span: '18 Apr to 15 Oct'}, 1: {rows: 203, file: 'barclays-joint-oct26.csv', span: '18 Apr to 15 Oct'}, 2: {rows: 156, file: 'amex-activity.csv', span: '1 Apr to 14 Oct'}};
 go(k);
}
function sheet(k, arg) { closeSheet(); const ph = $('.phone'); ph.insertAdjacentHTML('beforeend', `<div class="sheetbg" onclick="closeSheet()"></div><div class="sheet"><div class="grab"></div>${SHEETS[k](arg)}</div>`); }
function closeSheet() { document.querySelectorAll('.sheet,.sheetbg').forEach(e => e.remove()); }
function pick(e, key) { const c = e.target.closest('.c'); if (!c) return; c.parentNode.querySelectorAll('.c').forEach(x => x.classList.remove('on')); c.classList.add('on'); if (key) { const t = c.textContent; S[key] = t.replace('Every ', '').replace('On payday', 'Payday').replace(/^./, m => m.toUpperCase()); } }
function fillAcc(n, b, t) { $('#an').value = n; $('#ab').value = b; $('#at').querySelectorAll('.c').forEach(x => x.classList.toggle('on', x.textContent === t)); }
function addAcc() {
 const name = $('#an').value.trim() || 'My account', bank = $('#ab').value.trim() || 'My bank', type = $('#at .c.on').textContent;
 S.accounts.push({name, bank, type, colour: COLOURS[S.accounts.length % COLOURS.length]}); closeSheet(); render();
}
function importFile(f, rows, span) { S.imported[S.picking] = {rows, file: f, span}; closeSheet(); render(); }
function spends() {
 if (!S.spends) {
  const cur = S.accounts.findIndex(a => a.type !== 'Credit card' && a.type !== 'Joint');
  const c0 = cur < 0 ? 0 : cur;
  const joint = S.accounts.findIndex((a, i) => a.bank === S.accounts[c0].bank && i !== c0 && a.type !== 'Credit card');
  const card = S.accounts.findIndex(a => a.type === 'Credit card');
  const bank = S.accounts[c0].bank;
  S.spends = [
   {n: 'Pret A Manger', src: 'Wallet', when: 'today', amt: 4.20, acct: c0},
   {n: 'Tesco', src: bank + ' app', when: 'yesterday', amt: 38.55, acct: joint >= 0 ? joint : c0, guessed: joint >= 0},
   {n: 'Shell', src: 'Wallet', when: 'Thu', amt: 52.10, acct: card >= 0 ? card : c0},
   {n: 'Amazon', src: bank + ' app', when: 'Wed', amt: 17.99, acct: c0},
  ];
 }
 return S.spends;
}
function money(v) { return v.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function expected() { return 1206.40 - spends().filter(x => x.acct === 0).reduce((t, x) => t + x.amt, 0); }
function bankSays() { return S.typed != null ? S.typed : 1127.06 - spends().filter(x => x.extra && x.acct === 0).reduce((t, x) => t + x.amt, 0); }
function misplaced() { return spends().find(x => x.guessed && x.acct !== 0 && Math.abs(expected() - bankSays() - 18.60 - x.amt) < 0.005); }
function moveTo(i, ai) { const x = spends()[i]; x.acct = ai; x.guessed = false; closeSheet(); render(); }
function checkBal() { const v = parseFloat(($('#bal') || {value: ''}).value.replace(/[£,]/g, '')); if (!isNaN(v)) S.typed = v; if (misplaced()) { sheet('balanceResult'); return; } S.checked = true; closeSheet(); render(); }
function simulate() {
 if (stack[stack.length - 1] !== 'home') jump('home');
 const bank = S.accounts[0].bank, same = S.accounts.map((a, i) => [a, i]).filter(([a]) => a.bank === bank && a.type !== 'Credit card');
 const mode = S.shared[bank] || 'ask';
 const sp = {n: 'Co-op', src: bank + ' app', when: 'just now', amt: 12.40, acct: null, extra: true};
 document.querySelectorAll('.hn').forEach(e => e.remove());
 if (same.length < 2 || mode !== 'ask') {
  sp.acct = same.length < 2 ? 0 : mode === 'guess' ? same[1][1] : same[+mode.slice(1)][1]; sp.guessed = same.length > 1 && mode === 'guess';
  spends().unshift(sp); render(); toast(`£12.40 at Co-op · ${bank} app → ${S.accounts[sp.acct].name}${sp.guessed ? ' (a guess)' : ''}`); return;
 }
 spends().unshift(sp); render();
 const hn = document.createElement('div'); hn.className = 'hn';
 hn.style.cssText = 'position:absolute;left:10px;right:10px;top:36px;background:#2b2d33;border-radius:20px;padding:12px 14px;z-index:15;box-shadow:0 8px 24px rgba(0,0,0,.5);font-family:Roboto,Arial,sans-serif';
 hn.innerHTML = `<div style="font-size:11px;color:#aab;display:flex;gap:6px;align-items:center"><span style="width:14px;height:14px;border-radius:50%;background:#43b05c;display:inline-block"></span>SpenDroid · now<span style="margin-left:auto;cursor:pointer;font-size:14px" onclick="this.closest('.hn').remove()">✕</span></div>
  <div style="font-size:14px;font-weight:700;margin-top:6px">£12.40 at Co-op · which account?</div><div style="font-size:13px;color:#c5c8cf">${bank} didn't say. Not counted until you choose.</div>
  <div style="display:flex;gap:18px;margin-top:10px;font-size:13px;font-weight:700;color:#a8d5b4">${same.map(([a, i]) => `<span style="cursor:pointer" onclick="spends()[0].acct=${i};this.closest('.hn').remove();render()">${a.name.replace(' Account', '').toUpperCase()}</span>`).join('')}</div>`;
 $('.phone').appendChild(hn);
}

function toast(t) { const d = document.createElement('div'); d.textContent = t; d.style.cssText = 'position:absolute;left:20px;right:20px;bottom:90px;background:#e8e9ec;color:#111;border-radius:12px;padding:12px 14px;font-size:13px;font-weight:700;z-index:20'; $('.phone').appendChild(d); setTimeout(() => d.remove(), 2600); }
go('welcome');
</script>
</body></html>

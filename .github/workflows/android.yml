name: Android CI/CD

on:
  push:
    branches: [master]
    # A README edit is not a release. Everything that can change what the app does lives
    # under SpenDroid/, so a push touching nothing else has nothing to publish.
    paths:
      - 'SpenDroid/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SpenDroid
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Install Android SDK
        run: |
          mkdir -p $ANDROID_HOME
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "ndk;27.0.12077973" \
            "platform-tools" > /dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_PATH
          
      - name: Restore release signing key
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            # A pull request only needs to prove the code builds, so it may fall back to the
            # debug key. A push to master publishes, and must not.
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "::error::RELEASE_KEYSTORE_B64 is not set. A published release would be"
              echo "::error::signed with the debug key and could not update real installs."
              exit 1
            fi
            echo "::warning::No release key available; this build uses the debug key."
            exit 0
          fi
          mkdir -p keystore
          echo "$KEYSTORE_B64" | base64 -d > keystore/spendroid-release.jks
          keytool -list -keystore keystore/spendroid-release.jks \
            -storepass "${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" | grep -i "SHA-256" || true

      - name: Verify debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -alias debug -keystore debug.keystore -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
        working-directory: ${{ github.workspace }}/SpenDroid/app
          
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
            
      - name: Build Debug APK
        run: ./gradlew assembleDebug
        
      - name: Build Release APK
        env:
          SPENDROID_KEYSTORE: keystore/spendroid-release.jks
          SPENDROID_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          SPENDROID_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          SPENDROID_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease
        
      - name: Confirm the release APK carries the release key
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          DN=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk \
            | grep -m1 "certificate DN")
          echo "$DN"
          if echo "$DN" | grep -q "Android Debug" && [ "${{ github.event_name }}" = "push" ]; then
            echo "::error::Release APK is signed with the debug key - refusing to publish it."
            exit 1
          fi

      - name: Get version info
        id: version
        run: |
          # Extract versionName and versionCode using awk
          VERSION_NAME=$(awk -F'"' '/versionName/ {print $2}' app/build.gradle.kts)
          VERSION_CODE=$(awk '/versionCode/ {gsub(/[^0-9]/,"",$0); print $0}' app/build.gradle.kts)
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "Extracted version_name: $VERSION_NAME"
          echo "Extracted version_code: $VERSION_CODE"
          
      - name: Build update manifest
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          TAG="v${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}"
          cat > update.json <<EOF
          {
            "versionCode": ${{ steps.version.outputs.version_code }},
            "versionName": "${{ steps.version.outputs.version_name }}",
            "apkUrl": "https://github.com/${{ github.repository }}/releases/download/$TAG/app-release.apk",
            "apkSha256": "$SHA",
            "minSdk": 26,
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat update.json

      - name: Upload update manifest
        uses: actions/upload-artifact@v4
        with:
          name: update-manifest
          path: SpenDroid/update.json

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: SpenDroid/app/build/outputs/apk/debug/app-debug.apk
          
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: SpenDroid/app/build/outputs/apk/release/app-release.apk

      # R8 renames everything it shrinks, so a crash report from a release build is
      # unreadable without the mapping produced by that exact build. It is generated once
      # and cannot be recreated afterwards, so it is kept with the build that made it.
      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: mapping
          path: SpenDroid/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 90

  release:
    needs: build
    # Only a push to master publishes. Without this the job also ran on pull_request,
    # so opening a PR cut a public GitHub Release from unreviewed code - and made a PR
    # unusable as a way to check a build before releasing it.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Debug APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: artifacts
          
      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: app-release
          path: artifacts

      - name: Download update manifest
        uses: actions/download-artifact@v4
        with:
          name: update-manifest
          path: artifacts
          
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version_name }}-${{ needs.build.outputs.version_code }}
          name: SpenDroid v${{ needs.build.outputs.version_name }} (build ${{ needs.build.outputs.version_code }})
          body: |
            versionCode: ${{ needs.build.outputs.version_code }}
            versionName: ${{ needs.build.outputs.version_name }}
            Auto-generated release from commit ${{ github.sha }}
          files: |
            artifacts/app-debug.apk
            artifacts/app-release.apk
            artifacts/update.json
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}